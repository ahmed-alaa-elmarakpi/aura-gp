[project]
name = "aura-gp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.126",
    "celery>=5.7.0",
    "channels>=4.3.2",
    "channels-redis>=4.3.0",
    "cryptography>=50.0.2",
    "daphne>=4.2.3",
    "django>=6.1.3",
    "django-environ>=0.14.0",
    "django-redis>=7.0.0",
    "django-storages>=1.14.6",
    "djangorestframework>=3.18.3",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30.0",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.8",
    "sendgrid>=6.12.5",
]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "factory-boy>=3.3.3",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.4",
]
